};

const TIERS = [T1, T2, T3];

// بيانات القوالب: الباب والمفهوم لكل قالب (تُحسب مرة واحدة)
const META = TIERS.map((tier) => tier.map((fn) => { try { const s = fn(); return { ch: s.ch, cat: s.cat }; } catch (e) { return { ch: "الكل", cat: "عام" }; } }));
const CH_MAP = META.map((t) => t.map((m) => m.ch));
const ALL_CATS = [...new Set(META.flat().map((m) => m.cat))];
const CAT_CH = {}; META.flat().forEach((m) => { if (!CAT_CH[m.cat]) CAT_CH[m.cat] = m.ch; });

// ====== محرك عدم التكرار: كيس مخلوط + بصمات الأسئلة ======
const bags = {};
const seenSet = new Set();
const seenList = [];
const rememberQ = (q) => {
  if (seenSet.has(q)) return;
  seenSet.add(q); seenList.push(q);
  while (seenList.length > 400) seenSet.delete(seenList.shift());
};
// إعادة متباعدة للأخطاء: السؤال اللي غلطت فيه يرجع مرة واحدة بعد سؤالين-ثلاثة، مو فوراً
const wrongQ = [];
const pushWrong = (t, i) => { if (wrongQ.length < 5 && !wrongQ.some((w) => w.t === t && w.i === i)) wrongQ.push({ t, i, wait: ri(2, 3) }); };
// ذاكرة القوالب الأخيرة: نفس القالب ما يرجع خلال آخر ١٠ أسئلة حتى بأرقام جديدة
const recentTpl = [];
const noteTpl = (t, i) => { recentTpl.push(t + "|" + i); while (recentTpl.length > 10) recentTpl.shift(); };
const makeQuant = (tier, chapter) => {
  const t = Math.min(tier, 2);
  wrongQ.forEach((w) => w.wait--);
  const dueIdx = wrongQ.findIndex((w) => w.wait <= 0 && (chapter === "الكل" || CH_MAP[w.t][w.i] === chapter));
  if (dueIdx !== -1) {
    const { t: wt, i: wi } = wrongQ.splice(dueIdx, 1)[0];
    let rq = TIERS[wt][wi]();
    let rtries = 0;
    while (seenSet.has(rq.q) && rtries < 8) { rq = TIERS[wt][wi](); rtries++; }
    rememberQ(rq.q);
    noteTpl(wt, wi);
    return { ...rq, id: Math.random().toString(36).slice(2), _t: wt, _i: wi, isRetry: true };
  }
  const key = t + "|" + chapter;
  let indices = TIERS[t].map((_, i) => i);
  if (chapter && chapter !== "الكل") {
    const f = indices.filter((i) => CH_MAP[t][i] === chapter);
    if (f.length >= 2) indices = f;
  }
  if (!bags[key] || bags[key].length === 0) bags[key] = shuffle(indices);
  let idx = bags[key].pop();
  let guard = bags[key].length;
  while (guard > 0 && recentTpl.includes(t + "|" + idx)) { bags[key].unshift(idx); idx = bags[key].pop(); guard--; }
  let q = TIERS[t][idx]();
  let tries = 0;
  while (seenSet.has(q.q) && tries < 8) { q = TIERS[t][idx](); tries++; }
  rememberQ(q.q);
  noteTpl(t, idx);
  return { ...q, id: Math.random().toString(36).slice(2), _t: t, _i: idx };
};

  const isPaid = plan === "season" || plan === "month";

  const freeLeft = isPaid ? Infinity : Math.max(0, 10 - (freeQDay === dayKeyNow() ? freeQToday : 0));
  const hasAI = isPaid;
  const arrP = (v) => (Array.isArray(v) ? v : v ? [v] : []);

  const recMonthly = profile && arrP(profile.when).includes("أقل من شهر");
  const composeWelcome = (a) => {

              {OB.map((_, i) => <div key={i} style={{ width: 8, height: 8, borderRadius: "50%", background: i <= obStep ? C.cobalt : "rgba(255,255,255,0.7)" }} />)}
            </div>
            <h1 style={{ fontSize: "clamp(21px, 6.2vw, 27px)", fontWeight: 700, lineHeight: 1.7, margin: "0 0 8px", textAlign: "center" }}>{OB[obStep].q}</h1>
            {OB[obStep].k === "worry" ? <div style={{ fontSize: 12, opacity: 0.55, textAlign: "center", margin: "0 0 14px" }}>تقدر تختار أكثر من إجابة</div> : <div style={{ height: 10 }} />}
            <div style={{ display: "grid", gap: 10 }}>
              {OB[obStep].opts.map((o) => { const multi = OB[obStep].k === "worry"; const on = multi && (obAns[OB[obStep].k] || []).includes(o); return (
                <button key={o} onClick={() => { if (!multi) { setObAns({ ...obAns, [OB[obStep].k]: o }); setObStep(obStep + 1); return; } const cur = obAns[OB[obStep].k] || []; setObAns({ ...obAns, [OB[obStep].k]: on ? cur.filter((x) => x !== o) : [...cur, o] }); }}
                  style={{ background: on ? "rgba(27,58,200,0.07)" : C.card, border: `2px solid ${on ? C.cobalt : "transparent"}`, color: C.ink, borderRadius: 16, padding: "15px 18px", fontSize: 15.5, fontWeight: 600, textAlign: "right", cursor: "pointer", fontFamily: "inherit", boxShadow: "0 3px 10px rgba(27,58,200,0.07)" }}>
                  {o}{on ? " ✓" : ""}
                </button>
              ); })}
            </div>
            {OB[obStep].k === "worry" && <button disabled={!(obAns.worry || []).length} onClick={() => setObStep(obStep + 1)} style={{ ...primaryBtn, width: "100%", marginTop: 14, padding: 15, fontSize: 15.5, opacity: (obAns.worry || []).length ? 1 : 0.45 }}>التالي</button>}
            <button onClick={() => { setIntroSeen(true); setScreen("main"); setTab("train"); }} style={{ display: "block", margin: "16px auto 0", border: "none", background: "none", color: "rgba(36,27,77,0.5)", fontFamily: "inherit", fontWeight: 700, fontSize: 12.5, cursor: "pointer" }}>تخطَّ الأسئلة</button>
          </div>
        ) : (
          <div style={{ width: "100%", maxWidth: 380, textAlign: "center", animation: "popIn .35s ease both" }}>
            <Sparkle size={54} />
            <h1 style={{ fontSize: "clamp(24px, 7vw, 30px)", fontWeight: 700, margin: "16px 0 10px", lineHeight: 1.6 }}>وصلت مكانك الآمن</h1>
            <p style={{ fontSize: 15, lineHeight: 2, opacity: 0.85, margin: "0 0 22px", minHeight: "6em", textAlign: "right" }}>
              {welcomeMsg.slice(0, typedN)}{typedN < welcomeMsg.length ? <span style={{ opacity: 0.45 }}>▍</span> : null}
            </p>
            <div style={{ fontSize: 13, fontWeight: 700, color: C.gold, marginBottom: 14 }}>✦ أول سؤال تحله يشعل شرارتك اليومية</div>
            <button onClick={() => { setProfile(obAns); setIntroSeen(true); setScreen("main"); setTab("train"); }} style={{ ...primaryBtn, width: "100%", padding: 17, fontSize: 16.5, boxShadow: "0 10px 28px rgba(27,58,200,0.3)" }}>
              ابدأ التدريب
            </button>
            <button onClick={() => { setProfile(obAns); setIntroSeen(true); setScreen("main"); setTab("feed"); }} style={{ border: "none", background: "none", color: "rgba(36,27,77,0.6)", fontFamily: "inherit", fontWeight: 700, fontSize: 13.5, marginTop: 14, cursor: "pointer" }}>
              أو شوف فيد فوس
            </button>
          </div>
        )}
      </div>
    );
  }

  // ====== بطاقاتك المحفوظة من الفيد ======
  if (screen === "savedFeed") {
    return (
      <div dir="rtl" style={{ ...shell, overflow: "auto" }}>
        {css}
        <div style={{ padding: "16px 20px 30px", maxWidth: 520, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <button onClick={() => setScreen("main")} style={{ border: "none", background: "rgba(255,255,255,0.6)", borderRadius: 999, padding: "7px 14px", fontFamily: "inherit", fontWeight: 700, fontSize: 13, cursor: "pointer", color: C.ink }}>→ رجوع</button>
            <span style={{ fontWeight: 700, fontSize: 17, color: C.cobalt }}>بطاقاتك من الفيد ({toAr(savedCards.length)})</span>
          </div>
          {savedCards.length === 0 && <div style={{ fontSize: 14, opacity: 0.65, textAlign: "center", marginTop: 40 }}>ما عندك بطاقات محفوظة — القلب في الفيد يحفظها لك هنا.</div>}
          {[...savedCards].reverse().map((c, i) => (
            <div key={i} style={{ background: C.card, borderRadius: 18, padding: "16px 18px", marginBottom: 10, boxShadow: "0 6px 18px rgba(27,58,200,0.08)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                <span style={{ background: C.cobalt, color: "#fff", borderRadius: 999, fontSize: 11.5, fontWeight: 700, padding: "4px 12px" }}>{c.tag}</span>
                {c.ch && <span style={{ fontSize: 11, fontWeight: 700, opacity: 0.55 }}>{c.ch}</span>}
                <button onClick={() => toggleSave(c)} style={{ marginRight: "auto", border: "none", background: "none", cursor: "pointer", padding: 4 }}>
                  <Heart size={18} filled={true} />
                </button>
              </div>
              <div style={{ fontWeight: 700, fontSize: 16.5, lineHeight: 1.7, marginBottom: 6 }}>{c.title}</div>
              <div style={{ fontSize: 14, lineHeight: 1.9, opacity: 0.85, whiteSpace: "pre-line" }}>{c.body}</div>
              {c.ex && <div style={{ fontSize: 12.5, lineHeight: 1.8, opacity: 0.7, marginTop: 8, borderRight: `3px solid ${C.gold}`, paddingRight: 10 }}>{c.ex}</div>}
            </div>
          ))}
        </div>
      </div>
    );
  }

  // ====== التقرير ======
  if (screen === "report") {
    return (
      <div dir="rtl" style={{ ...shell, overflow: "auto" }}>
        {css}
        <div style={{ padding: "16px 20px 30px", maxWidth: 520, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 14 }}>
            <button onClick={() => setScreen("main")} style={{ border: "none", background: "rgba(255,255,255,0.6)", borderRadius: 999, padding: "7px 14px", fontFamily: "inherit", fontWeight: 700, fontSize: 13, cursor: "pointer", color: C.ink }}>→ رجوع</button>
            <span style={{ fontWeight: 700, fontSize: 17, color: C.cobalt }}>تقريرك</span>
          </div>

          <div style={{ background: C.card, borderRadius: 20, padding: 20, boxShadow: "0 8px 24px rgba(27,58,200,0.09)", textAlign: "center" }}>
            <div style={{ fontSize: 13, opacity: 0.65 }}>توقع درجتك (نطاق تقديري — يتحدّث مع كل سؤال تحله)</div>
            <div style={{ fontSize: 38, fontWeight: 700, color: C.cobalt, marginTop: 4 }}>{forecast != null ? `${toAr(Math.max(40, forecast - 4))} - ${toAr(Math.min(100, forecast + 4))}` : "—"}</div>
            {forecast != null && fcBase && (
              <div style={{ fontSize: 13.5, fontWeight: 700, marginTop: 2, color: forecast - fcBase.v > 0 ? C.ok : forecast - fcBase.v < 0 ? C.bad : "rgba(36,27,77,0.5)" }}>
                {forecast - fcBase.v > 0 ? `↑ +${toAr(forecast - fcBase.v)} هذا الأسبوع` : forecast - fcBase.v < 0 ? `↓ ${toAr(Math.abs(forecast - fcBase.v))}− هذا الأسبوع` : "ثابت هذا الأسبوع — حرّكه بالتدريب"}
              </div>
            )}
            {forecast == null && <div style={{ fontSize: 12.5, opacity: 0.6 }}>حل ١٢ سؤالاً على الأقل في التدريب ليظهر توقعك</div>}
            {profile && profile.expect && <div style={{ fontSize: 12.5, opacity: 0.65, marginTop: 8 }}>توقعك لنفسك يوم بدأت: «{prTxt(profile.expect)}» — خلّ الأرقام تتكلم عنك ✦</div>}
          </div>

          <div style={{ background: C.card, borderRadius: 20, padding: 18, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
            <div style={{ fontWeight: 700, fontSize: 14.5, marginBottom: 10 }}>قوتك في كل باب</div>
            {chapterStats.map(({ ch, acc }) => (
              <div key={ch} style={{ marginBottom: 10 }}>
                <div style={{ display: "flex", fontSize: 12.5, fontWeight: 700, marginBottom: 4 }}>
                  <span>{ch}</span>
                  <span style={{ marginRight: "auto", opacity: 0.6 }}>{acc == null ? "غير مختبر" : `${toAr(Math.round(acc * 100))}٪`}</span>
                </div>
                <div style={{ height: 7, background: C.bgSoft, borderRadius: 999, overflow: "hidden" }}>
                  <div style={{ height: "100%", width: `${(acc || 0) * 100}%`, background: acc == null ? C.bgSoft : acc < 0.5 ? C.bad : acc < 0.8 ? C.gold : C.ok, borderRadius: 999 }} />
                </div>
              </div>
            ))}
          </div>

          {isPaid ? (
            <>
              <div style={{ background: C.card, borderRadius: 20, padding: 18, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
                <div style={{ fontWeight: 700, fontSize: 14.5, marginBottom: 8 }}>أضعف مفاهيمك الآن</div>
                {weakList.length ? weakList.map((c) => (
                  <div key={c} style={{ display: "flex", fontSize: 13.5, padding: "7px 0", borderBottom: `1px solid ${C.bgSoft}` }}>
                    <span style={{ fontWeight: 700 }}>{c}</span>
                    <span style={{ marginRight: "auto", color: C.bad, fontWeight: 700 }}>{toAr(Math.round((accOf(c) || 0) * 100))}٪</span>
                  </div>
                )) : <div style={{ fontSize: 13, opacity: 0.6 }}>حل أسئلة أكثر ليتعرّف فوس على نقاط ضعفك</div>}
                {weakList[0] && <div style={{ fontSize: 13, fontWeight: 700, color: C.cobalt, marginTop: 10 }}>أقرب +٥ نقاط عندك في: {weakList[0]}</div>}
              </div>

              <button onClick={() => { const wch = chapterStats.filter((s) => s.acc != null).sort((a, b) => a.acc - b.acc)[0]; setChapter(wch ? wch.ch : "الكل"); setScreen("main"); setTab("train"); }} style={{ ...primaryBtn, width: "100%", marginTop: 14, padding: 16, fontSize: 16 }}>
                درّب على أضعف أبوابك الآن
              </button>
            </>
          ) : (
            <div style={{ background: C.card, borderRadius: 20, padding: 20, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.09)", textAlign: "center" }}>
              <Sparkle size={26} />
              <div style={{ fontWeight: 700, fontSize: 15.5, margin: "8px 0 6px" }}>تقريرك الكامل جاهز</div>
              <div style={{ fontSize: 13.5, lineHeight: 1.9, opacity: 0.75 }}>أضعف مفاهيمك بالتفصيل + أقرب نقاط ترفع درجتك + الفيد اللي يتشكل من أخطائك — بباقة فوس</div>
              <button onClick={() => setPaywall(true)} style={{ ...primaryBtn, width: "100%", marginTop: 12, padding: 13, fontSize: 14.5 }}>افتح التقرير الكامل</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ====== شاشة الأسئلة ======
  if (screen === "quiz") {
    const tdW = new Date(); const tW = tdW.getFullYear() + "-" + (tdW.getMonth() + 1) + "-" + tdW.getDate();
    const ydW = new Date(tdW.getTime() - 86400000); const yW = ydW.getFullYear() + "-" + (ydW.getMonth() + 1) + "-" + ydW.getDate();
    const lit = lastDay === tW ? dayStreak : lastDay === yW ? dayStreak : 0;
    const pend = lastDay !== tW;
    const shown = Math.min(lit, 7);
    const rem = Math.max(0, 7 - lit - (pend ? 1 : 0));
    const streakLabel = lit === 0 ? "شرارتك تشتعل بأول سؤال ✦" : lit === 1 ? "شرارة يوم واحد ✦" : lit === 2 ? "شرارة يومين ✦" : lit <= 10 ? `شرارة ${toAr(lit)} أيام ✦` : `شرارة ${toAr(lit)} يوماً ✦`;
    const goldLine = lit >= 7 ? "أسبوع ذهبي مكتمل — حافظ عليه" : rem === 0 ? "سؤال اليوم يكمّل أسبوعك الذهبي ✦" : rem === 1 ? (pend ? "أشعلها اليوم — ويوم واحد بعده يكمّل الأسبوع الذهبي ✦" : "يوم واحد ويكتمل أسبوعك الذهبي ✦") : rem === 2 ? (pend ? "أشعلها اليوم — ويومان بعده يكمّلان الأسبوع الذهبي ✦" : "يومان ويكتمل أسبوعك الذهبي ✦") : pend ? `أشعلها بأول سؤال — و${toAr(rem)} أيام تفصلك عن الأسبوع الذهبي ✦` : `${toAr(rem)} أيام وتكمل الأسبوع الذهبي ✦`;
    return (
      <div dir="rtl" style={shell}>
        {css}
        {quizIntro && (
            <div onTouchStart={(e) => e.stopPropagation()} onTouchEnd={(e) => e.stopPropagation()} style={{ position: "absolute", inset: 0, zIndex: 70, background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
              <div style={{ position: "relative", animation: "sparkIntro .8s cubic-bezier(.34,1.56,.64,1) both" }}>
                <Sparkle size={92} />
                <span style={{ position: "absolute", top: "50%", left: "50%", color: C.gold, fontSize: 20, animation: "burst1 .95s ease .2s both" }}>✦</span>
                <span style={{ position: "absolute", top: "50%", left: "50%", color: C.cobalt, fontSize: 15, animation: "burst2 .95s ease .28s both" }}>✦</span>
                <span style={{ position: "absolute", top: "50%", left: "50%", color: C.cobalt, fontSize: 16, animation: "burst3 .95s ease .24s both" }}>✦</span>
                <span style={{ position: "absolute", top: "50%", left: "50%", color: C.gold, fontSize: 14, animation: "burst4 .95s ease .32s both" }}>✦</span>
              </div>
              <div style={{ fontWeight: 800, fontSize: 19, color: lit >= 1 ? C.gold : C.cobalt, marginTop: 12, animation: "popIn .4s ease .3s both", textShadow: lit >= 1 ? "0 0 14px rgba(217,154,43,0.35)" : "none" }}>{streakLabel}</div>
              <div style={{ display: "flex", gap: 9, marginTop: 18, direction: "rtl" }}>
                {[0, 1, 2, 3, 4, 5, 6].map((i) => {
                  const filled = i < shown;
                  const isPend = pend && i === shown && lit < 7;
                  const last7 = i === 6;
                  return (
                    <div key={i} style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                      <div style={{ width: last7 ? 42 : 34, height: last7 ? 42 : 34, borderRadius: 999, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: last7 ? 16 : 13, boxSizing: "border-box", background: filled ? C.gold : "rgba(255,255,255,0.55)", color: filled ? "#fff" : isPend ? C.cobalt : "rgba(36,27,77,0.35)", border: isPend ? `2px dashed ${C.cobalt}` : last7 && !filled ? `2px solid ${C.gold}` : "2px solid transparent", animation: filled ? `popIn .35s ease ${0.4 + i * 0.11}s both` : isPend ? "streakRing 1.4s ease-out infinite" : "none", filter: filled ? "var(--sparkGlow, none)" : "none" }}>{filled ? "✦" : toAr(i + 1)}</div>
                      {last7 && <div style={{ fontSize: 10, fontWeight: 700, color: C.gold }}>ذهبي</div>}
                    </div>
                  );
                })}
              </div>
              <div style={{ fontWeight: 700, fontSize: 13.5, color: C.cobaltDark, marginTop: 14, textAlign: "center", animation: "fadeUp .4s ease .9s both" }}>{goldLine}</div>
              <div style={{ fontSize: 11.5, opacity: 0.5, marginTop: 5, animation: "fadeUp .4s ease 1.05s both" }}>يوم غياب واحد يطفيها</div>
              <button onClick={() => setQuizIntro(false)} style={{ ...primaryBtn, marginTop: 20, padding: "13px 44px", fontSize: 16, animation: "popIn .4s ease 1.2s both" }}>يلا نبدأ ✦</button>
            </div>
          )}
        <div style={{ padding: "14px 18px 6px", display: "flex", alignItems: "center", gap: 10, maxWidth: 560, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
          <button onClick={() => { setScreen("main"); setReviewQueue(null); }} style={{ border: "none", background: "rgba(255,255,255,0.6)", borderRadius: 999, padding: "7px 14px", fontFamily: "inherit", fontWeight: 700, fontSize: 13, cursor: "pointer", color: C.ink }}>→ خروج</button>
          <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", gap: 6, fontWeight: 700, fontSize: 12.5, color: C.cobaltDark }}>
            <Sparkle size={12} />
            <span>{reviewQueue ? `مراجعة المحفوظات ${toAr(reviewIdx + 1)} / ${toAr(reviewQueue.length)}` : `فوس · المستوى ${toAr(lvl)}${dayStreak > 0 ? ` · شرارة ${toAr(dayStreak)} ✦` : ""}`}</span>
          </div>
          <button onClick={toggleSaveQ} aria-label="حفظ السؤال" style={{ border: "none", background: "rgba(255,255,255,0.6)", borderRadius: 999, width: 34, height: 34, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
            <Heart size={16} filled={isQSaved} />
          </button>
          <div style={{ display: "flex", alignItems: "center", gap: 5, background: streak > 0 ? "rgba(217,154,43,0.18)" : "rgba(255,255,255,0.5)", borderRadius: 999, padding: "6px 12px", fontWeight: 700, fontSize: 13, color: streak > 0 ? "#B06E0F" : "rgba(36,27,77,0.5)" }}>
            <Flame size={12} color={streak > 0 ? "#B06E0F" : "rgba(36,27,77,0.35)"} /> {toAr(streak)}
          </div>
        </div>

        <div key={question.id} style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center", padding: "6px 20px 0", maxWidth: 560, width: "100%", margin: "0 auto", boxSizing: "border-box", animation: slide === "in" ? "slideIn .3s ease both" : "slideOut .24s ease both", overflowY: "auto" }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.cobalt, marginBottom: question.isRetry ? 4 : 10 }}>{question.ch} · {question.cat}</div>
          {question.isRetry && <div style={{ fontSize: 11.5, fontWeight: 700, color: C.gold, marginBottom: 10 }}>سؤال مشابه للي غلطت فيه قبل قليل — ثبّته ✦</div>}
          <h1 style={{ fontSize: "clamp(18px, 5vw, 25px)", fontWeight: 700, lineHeight: 1.75, margin: "0 0 20px", whiteSpace: "pre-line" }}>{question.q}</h1>

          <div style={{ display: "grid", gap: 10 }}>
            {question.opts.map((opt, i) => {
              const isCorrect = opt === question.ans;
              const isPicked = picked === i;
              let bg = C.card, border = "2px solid transparent", color = C.ink;
              if (phase === "revealed") {
                if (isCorrect) { bg = "#E3F6EE"; border = `2px solid ${C.ok}`; color = "#0E6B4E"; }
                else if (isPicked) { bg = "#FCE8EC"; border = `2px solid ${C.bad}`; color = "#9E2540"; }
                else color = "rgba(36,27,77,0.4)";
              }
              const fx = phase === "revealed" && isPicked && !isCorrect ? "shake .35s ease" : phase === "revealed" && isCorrect ? "popIn .3s ease" : "none";
              return (
                <button key={i} onClick={() => answer(i)} style={{ background: bg, border, color, borderRadius: 16, padding: "14px 18px", fontSize: question.isText ? 15.5 : 18, fontWeight: 600, textAlign: "right", cursor: phase === "answering" ? "pointer" : "default", fontFamily: "inherit", boxShadow: phase === "answering" ? "0 3px 10px rgba(27,58,200,0.07)" : "none", transition: "all .2s ease", animation: fx }}>
                  {typeof opt === "number" ? toAr(opt) : opt}
                </button>
              );
            })}
          </div>

          <div style={{ minHeight: 92, marginTop: 14, paddingBottom: 8 }}>
            {phase === "revealed" && (
              <div style={{ animation: "popIn .3s ease both" }}>
                <div style={{ background: "rgba(255,255,255,0.75)", borderRadius: 12, padding: "10px 14px", fontSize: 14, lineHeight: 1.8, borderRight: `4px solid ${question.opts[picked] === question.ans ? C.ok : C.bad}` }}>
                  {question.opts[picked] === question.ans ? `صح — ${toAr(10 + Math.min(streak - 1, 5) * 2 + tier * 4)}+ نقطة${streak >= 3 ? ` · سلسلة ${toAr(streak)} ✦` : ""}` : "خطأ — شوف الطريقة:"}
                  <div style={{ marginTop: 4 }}>{question.exp}</div>
                </div>

                {hasAI ? (
                  <div style={{ marginTop: 10 }}>
                    {aiMsgs.map((m, mi) => (
                      <div key={mi} style={m.role === "assistant" ? { marginTop: 8, background: C.card, borderRadius: 12, padding: "12px 14px", fontSize: 14, lineHeight: 1.9, borderRight: `4px solid ${C.cobalt}`, whiteSpace: "pre-line", animation: "popIn .3s ease both" } : { marginTop: 8, background: C.bgSoft, borderRadius: 12, padding: "10px 14px", fontSize: 13.5, lineHeight: 1.8, borderLeft: `4px solid ${C.gold}`, whiteSpace: "pre-line" }}>
                        {m.text}
                      </div>
                    ))}
                    {aiLoading && (
                      <div style={{ marginTop: 8, background: C.card, borderRadius: 12, padding: "12px 14px", fontSize: 13.5, color: "rgba(36,27,77,0.6)", fontWeight: 700, animation: "pulse 1.1s ease infinite" }}>المساعد يكتب…</div>
                    )}
                    {aiMsgs.length === 0 && !aiLoading && (AI_READY ? (
                      <button onClick={() => aiAsk(null)} style={{ width: "100%", padding: 12, borderRadius: 12, border: `2px solid ${C.cobalt}`, background: "rgba(255,255,255,0.6)", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>
                        اشرحها لي أكثر — بالذكاء الاصطناعي
                      </button>
                    ) : (
                      <div style={{ width: "100%", padding: 12, borderRadius: 12, background: "rgba(255,255,255,0.45)", color: "rgba(36,27,77,0.5)", fontWeight: 700, fontSize: 13, textAlign: "center", boxSizing: "border-box" }}>الشرح الذكي — يتفعّل قريباً ✦</div>
                    ))}
                    {AI_READY && aiMsgs.length > 0 && histPos === null && aiMsgs.filter((m) => m.role === "user").length < 5 && (
                      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                        <input value={aiDraft} onChange={(e) => setAiDraft(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") sendFollow(); }} placeholder="اسأل المساعد عن أي خطوة…" style={{ flex: 1, border: `1.5px solid ${C.bgSoft}`, borderRadius: 12, padding: "11px 13px", fontFamily: "inherit", fontSize: 13.5, background: "rgba(255,255,255,0.85)", color: C.ink }} />
                        <button onClick={sendFollow} disabled={aiLoading || !aiDraft.trim()} style={{ ...primaryBtn, padding: "0 18px", fontSize: 13.5, opacity: aiLoading || !aiDraft.trim() ? 0.45 : 1 }}>أرسل</button>
                      </div>
                    )}
                    {aiMsgs.filter((m) => m.role === "user").length >= 5 && (
                      <div style={{ marginTop: 8, fontSize: 12, fontWeight: 700, color: "rgba(36,27,77,0.55)", textAlign: "center" }}>وصلنا حدّ المحادثة لهذا السؤال ✦</div>
                    )}
                  </div>
                ) : (
                  <button onClick={() => setPaywall(true)} style={{ width: "100%", marginTop: 10, padding: 10, borderRadius: 12, border: "none", background: "rgba(255,255,255,0.5)", color: "rgba(36,27,77,0.6)", fontWeight: 700, fontFamily: "inherit", fontSize: 12.5, cursor: "pointer" }}>
                    الشرح الذكي ضمن باقة فوس — اضغط للتفاصيل
                  </button>
                )}
              </div>
            )}
          </div>
        </div>

        <div style={{ padding: "0 20px 20px", maxWidth: 560, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
          {!reviewQueue && histPos !== null ? (
            <div>
              <div style={{ textAlign: "center", fontSize: 11.5, fontWeight: 700, color: "rgba(36,27,77,0.55)", marginBottom: 8 }}>تتصفح سؤالاً سابقاً {toAr(histPos + 1)} / {toAr(hist.length)} — للاطلاع فقط</div>
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={goPrev} disabled={histPos === 0} style={{ flex: 1, border: `2px solid ${C.cobalt}`, background: "rgba(255,255,255,0.6)", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 15, borderRadius: 16, padding: 14, cursor: "pointer", opacity: histPos === 0 ? 0.4 : 1 }}>السابق</button>
                <button onClick={goNext} style={{ ...primaryBtn, flex: 1.4, padding: 14, fontSize: 15 }}>{histPos < hist.length - 1 ? "التالي" : "ارجع لسؤالك ✦"}</button>
              </div>
            </div>
          ) : phase === "revealed" ? (
            <div style={{ display: "flex", gap: 10 }}>
              {!reviewQueue && hist.length > 0 && (
                <button onClick={goPrev} style={{ border: `2px solid ${C.cobalt}`, background: "rgba(255,255,255,0.6)", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 15, borderRadius: 16, padding: "14px 18px", cursor: "pointer" }}>السابق</button>
              )}
              <button onClick={goNext} style={{ ...primaryBtn, flex: 1, padding: 16, fontSize: 17, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                السؤال التالي <Chevron up size={15} />
              </button>
            </div>
          ) : (
            !reviewQueue && hist.length > 0 ? (
              <button onClick={goPrev} style={{ display: "block", margin: "0 auto", border: "none", background: "rgba(255,255,255,0.6)", borderRadius: 999, padding: "9px 18px", fontFamily: "inherit", fontWeight: 700, fontSize: 12.5, cursor: "pointer", color: C.ink }}>→ السؤال السابق</button>
            ) : null
          )}
        </div>

        {lvlPop && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(36,27,77,0.5)", zIndex: 50, animation: "popIn .35s ease both" }}>
            <div style={{ textAlign: "center", padding: "32px 44px", borderRadius: 24, background: C.card, boxShadow: "0 0 50px rgba(27,58,200,0.35)" }}>
              <Sparkle size={46} />
              <div style={{ fontSize: 14, opacity: 0.7, marginTop: 8 }}>مستوى جديد</div>
              <div style={{ fontSize: 32, fontWeight: 700, color: C.cobalt }}>المستوى {toAr(lvlPop)}</div>
            </div>
          </div>
        )}

        {streakPop > 0 && (
          <div onClick={() => setStreakPop(0)} style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(36,27,77,0.55)", zIndex: 55, animation: "popIn .35s ease both", padding: 20, boxSizing: "border-box" }}>
            <div onClick={(e) => e.stopPropagation()} style={{ textAlign: "center", padding: "30px 30px 22px", borderRadius: 24, background: C.card, boxShadow: "0 0 50px rgba(217,154,43,0.4)", maxWidth: 330, width: "100%" }}>
              <div style={{ display: "inline-block", animation: "pulse 1.1s ease infinite" }}><Sparkle size={46} /></div>
              <div style={{ fontSize: 22, fontWeight: 700, color: C.cobalt, marginTop: 10 }}>{streakPop === 1 ? "ولدت شرارتك ✦" : streakPop === 2 ? "شرارة يومين ✦" : `شرارة ${toAr(streakPop)} ${streakPop >= 11 ? "يوماً" : "أيام"} ✦`}</div>
              <div style={{ fontSize: 13.5, opacity: 0.75, marginTop: 6, lineHeight: 1.9 }}>{streakPop === 1 ? "ارجع بكرة وخلّها تكبر — الشرارة تنطفئ لو غبت يوماً." : "كل يوم تدريب يكبّرها — ويوم غياب واحد يطفيها."}</div>
              <button onClick={() => setStreakPop(0)} style={{ ...primaryBtn, width: "100%", marginTop: 16, padding: 12, fontSize: 14.5 }}>كمّل ✦</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ====== الرئيسية ======
  const card = feedDeck[Math.min(feedIdx, feedDeck.length - 1)];
  const nextCard = feedDeck[feedIdx + 1];
  const prevCard = feedIdx > 0 ? feedDeck[feedIdx - 1] : null;
  const H = feedH();

  const FeedSlide = ({ c, saved = false, onSave = () => {} }) => {
    const tc = { "قانون كمي": C.cobalt, "فخ شهير": C.bad, "استراتيجية اختبار": C.gold, "علم التعلم": C.ok, "سرعة إنجاز": "#3FB8A8", "تمرين خاطف": C.cobaltDark }[c?.tag] || C.cobalt;
    return (
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", justifyContent: "center", padding: "24px 26px 60px", boxSizing: "border-box", background: `radial-gradient(120% 90% at 50% 0%, ${tc}22 0%, transparent 55%), ${C.bg}` }}>
        <span style={{ alignSelf: "flex-start", background: tc, color: "#fff", borderRadius: 999, fontSize: 12.5, fontWeight: 700, padding: "6px 16px" }}>{c.tag}</span>
        {c.why && <span style={{ alignSelf: "flex-start", marginTop: 8, background: "rgba(255,255,255,0.8)", color: C.bad, borderRadius: 999, fontSize: 11.5, fontWeight: 700, padding: "5px 13px" }}>مُختار لضعفك في {c.why}</span>}
        <h2 style={{ fontSize: "clamp(26px, 7.5vw, 38px)", fontWeight: 700, lineHeight: 1.5, margin: "20px 0 12px" }}>{c.title}</h2>
        <p style={{ fontSize: "clamp(17px, 4.8vw, 21px)", lineHeight: 1.95, margin: 0, opacity: 0.9 }}>{c.body}</p>
        {c.ex && (
          <div style={{ marginTop: 20, background: "rgba(255,255,255,0.65)", borderRadius: 16, padding: "14px 16px", fontSize: 15.5, lineHeight: 1.9, borderRight: `4px solid ${tc}` }}>
            {c.ex}
          </div>
        )}
        <button onPointerDown={(e) => e.stopPropagation()} onClick={onSave}
          style={{ position: "absolute", bottom: 78, left: 20, width: 46, height: 46, borderRadius: "50%", border: "none", background: "rgba(255,255,255,0.85)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 4px 14px rgba(27,58,200,0.15)" }}
          aria-label="حفظ">
          <Heart size={21} filled={saved} />
        </button>
      </div>
    );
  };

  return (
    <div dir="rtl" style={shell}>
      {css}
      <div style={{ flex: 1, overflowY: tab === "feed" ? "hidden" : "auto", display: "flex", flexDirection: "column", position: "relative" }}>

        {/* --- الفيد: شاشة كاملة بسحب تيك توك (للمشتركين) --- */}
        {tab === "feed" && isPaid && (
          <div ref={feedRef} onPointerDown={feedDown} onPointerMove={feedMove} onPointerUp={feedUp} onPointerCancel={feedUp} onWheel={feedWheel}
            style={{ position: "absolute", inset: 0, overflow: "hidden", touchAction: "none", cursor: "grab" }}>
            <div style={{ position: "absolute", inset: 0, transform: `translateY(${-drag}px)`, transition: anim ? "transform .27s cubic-bezier(.2,.8,.3,1)" : "none" }}>
              <FeedSlide c={card} saved={savedCards.some((x) => x.title === card.title && x.body === card.body)} onSave={() => toggleSave(card)} />
            </div>
            {nextCard && drag >= 0 && (
              <div style={{ position: "absolute", inset: 0, transform: `translateY(${H - drag}px)`, transition: anim ? "transform .27s cubic-bezier(.2,.8,.3,1)" : "none" }}>
                <FeedSlide c={nextCard} saved={savedCards.some((x) => x.title === nextCard.title && x.body === nextCard.body)} />
              </div>
            )}
            {prevCard && drag < 0 && (
              <div style={{ position: "absolute", inset: 0, transform: `translateY(${-H - drag}px)`, transition: anim ? "transform .27s cubic-bezier(.2,.8,.3,1)" : "none" }}>
                <FeedSlide c={prevCard} saved={savedCards.some((x) => x.title === prevCard.title && x.body === prevCard.body)} />
              </div>
            )}
            <div key={card.tag} style={{ position: "absolute", inset: 0, pointerEvents: "none", animation: "feedGlow .45s ease both", background: `radial-gradient(circle at 50% 26%, ${{ "قانون كمي": C.cobalt, "فخ شهير": C.gold, "سرعة إنجاز": "#7B57E3" }[card.tag] || C.cobalt}29, transparent 68%)` }} />
            <div style={{ position: "absolute", top: 14, right: 18, display: "flex", alignItems: "center", gap: 7, opacity: 0.85 }}>
              <Sparkle size={19} /><span style={{ fontWeight: 700, fontSize: 15, color: C.cobalt }}>فوس</span>
            </div>
            <div style={{ position: "absolute", bottom: 10, left: 0, right: 0, textAlign: "center", fontSize: 11.5, color: "rgba(36,27,77,0.45)", pointerEvents: "none" }}>
              اسحب للأعلى
            </div>
            <button onPointerDown={(e) => e.stopPropagation()} onClick={() => commitFeed(1)}
              style={{ position: "absolute", bottom: 78, right: 20, width: 46, height: 46, borderRadius: "50%", border: "none", background: C.cobalt, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", boxShadow: "0 4px 14px rgba(27,58,200,0.3)" }}
              aria-label="التالي">
              <Chevron up size={18} />
            </button>
          </div>
        )}

        {/* --- قفل الفيد لغير المشتركين --- */}
        {tab === "feed" && !isPaid && (
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 28, textAlign: "center" }}>
            <Sparkle size={46} />
            <h2 style={{ fontSize: 24, fontWeight: 700, margin: "16px 0 8px", lineHeight: 1.6 }}>فيد فوس — مفاهيم تتشكل من أخطائك</h2>
            <p style={{ fontSize: 14.5, lineHeight: 2, opacity: 0.8, maxWidth: 340, margin: "0 0 18px" }}>كل ما حليت أسئلة أكثر، الفيد يقرأ ضعفك ويطعمك القوانين والفخاخ اللي أنت تحتاجها بالضبط — مع الشرح الذكي والتقرير الكامل والمجتمع الخاص.</p>
            <button onClick={() => setPaywall(true)} style={{ ...primaryBtn, width: "100%", maxWidth: 340, padding: 15, fontSize: 15.5 }}>اشترك في فوس — يبدأ من ١٩ ر.س</button>
            <button onClick={() => setTab("train")} style={{ border: "none", background: "none", color: "rgba(36,27,77,0.55)", fontFamily: "inherit", fontWeight: 700, fontSize: 13, marginTop: 14, cursor: "pointer" }}>لك ١٠ أسئلة مجانية كل يوم — ابدأ التدريب</button>
          </div>
        )}

        {/* --- التدريب --- */}
        {tab === "train" && (
          <div style={{ padding: "16px 20px 20px", maxWidth: 520, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
              <span style={{ fontWeight: 700, fontSize: 17, color: C.cobalt }}>التدريب</span>
              <span style={{ marginRight: "auto", fontSize: 12, fontWeight: 700, color: C.ok, background: "rgba(255,255,255,0.7)", borderRadius: 999, padding: "5px 12px" }}>١٠ أسئلة مجانية يومياً</span>
            </div>

            <div style={{ background: C.card, borderRadius: 20, padding: 18, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 46, height: 46, borderRadius: "50%", background: C.bgSoft, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, color: C.cobalt, fontSize: 17 }}>{toAr(lvl)}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 700, fontSize: 15 }}>المستوى {toAr(lvl)} <span style={{ opacity: 0.55, fontWeight: 500 }}>· {TIER_LABEL[tier]}</span>{dayStreak > 0 ? <span style={{ color: C.gold }}> · شرارة {toAr(dayStreak)} ✦</span> : <span style={{ opacity: 0.45 }}> · شرارتك تشتعل بأول سؤال ✦</span>}</div>
                  <div style={{ fontSize: 12, opacity: 0.6, marginTop: 2 }}>{toAr(into)} / {toAr(need)} نقطة للمستوى {toAr(lvl + 1)}</div>
                </div>
                <div style={{ fontWeight: 700, color: C.cobalt, fontSize: 15 }}>{toAr(xp)}</div>
              </div>
              <div style={{ height: 8, background: C.bgSoft, borderRadius: 999, overflow: "hidden", marginTop: 12 }}>
                <div style={{ height: "100%", width: `${progress * 100}%`, background: C.cobalt, borderRadius: 999, transition: "width .6s ease" }} />
              </div>
            </div>

            {(() => {
              const top = Object.entries(interests).sort((a, b) => b[1] - a[1])[0];
              return top && top[1] >= 3 ? (
                <button onClick={() => setChapter(top[0])} style={{ width: "100%", marginTop: 12, padding: "11px 14px", borderRadius: 14, border: `2px dashed ${C.cobalt}`, background: "rgba(255,255,255,0.55)", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 13.5, cursor: "pointer", textAlign: "right" }}>
                  مقترح لك حسب اهتماماتك في الفيد: {top[0]}
                </button>
              ) : null;
            })()}
            <div style={{ display: "flex", gap: 8, overflowX: "auto", padding: "14px 0 8px" }}>
              {CHAPTERS.map((c) => (
                <button key={c} className="chip" onClick={() => setChapter(c)}
                  style={{ background: chapter === c ? C.cobalt : "rgba(255,255,255,0.7)", color: chapter === c ? "#fff" : C.ink }}>{c}</button>
              ))}
            </div>

            <button onClick={startQuiz} style={{ ...primaryBtn, width: "100%", marginTop: 6, padding: 17, fontSize: 17 }}>
              ابدأ التدريب — {TIER_LABEL[tier]} · {chapter}
            </button>
            {!isPaid && <div style={{ fontSize: 12.5, fontWeight: 700, color: freeLeft <= 2 ? "#E4536B" : C.cobalt, textAlign: "center", marginTop: 8 }}>باقي لك اليوم: {toAr(freeLeft)} من ١٠ أسئلة ✦</div>}

            <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
              {[["أسئلة", toAr(solved)], ["الدقة", `${toAr(accuracy)}٪`], ["أفضل سلسلة", toAr(best)]].map(([k, v]) => (
                <div key={k} style={{ flex: 1, background: "rgba(255,255,255,0.7)", borderRadius: 14, padding: "10px 6px", textAlign: "center" }}>
                  <div style={{ fontSize: 16, fontWeight: 700 }}>{v}</div>
                  <div style={{ fontSize: 11, opacity: 0.6 }}>{k}</div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* --- مكتبتي --- */}
        {tab === "lib" && (
          <div style={{ padding: "16px 20px 20px", maxWidth: 520, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
            <div style={{ fontWeight: 700, fontSize: 19, color: C.cobalt, marginBottom: 12 }}>المرجع ✦</div>

            <div style={{ background: C.card, borderRadius: 20, padding: 16, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
              <div style={{ fontWeight: 700, fontSize: 15 }}>تقرير الدرجة</div>
              <div style={{ fontSize: 12.5, opacity: 0.65, marginTop: 3 }}>نطاق توقعك وأضعف أبوابك وسهم الأسبوع</div>
              <button onClick={() => setScreen("report")} style={{ width: "100%", marginTop: 10, padding: 13, borderRadius: 16, border: `2px solid ${C.cobalt}`, background: "transparent", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>
                تقريري وتوقع درجتي
              </button>
            </div>

            <div style={{ background: C.card, borderRadius: 20, padding: 16, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 700, fontSize: 15 }}><Heart size={15} filled={savedQs.length > 0} color={C.cobalt} /> أسئلتي المحفوظة ({toAr(savedQs.length)})</div>
              <div style={{ fontSize: 12.5, opacity: 0.65, marginTop: 3 }}>كل سؤال حفظته بالقلب أثناء التدريب — راجعها كجولة</div>
              <button onClick={startReview} disabled={!savedQs.length} style={{ width: "100%", marginTop: 10, padding: 13, borderRadius: 16, border: `2px solid ${C.cobalt}`, background: savedQs.length ? "transparent" : C.bgSoft, color: savedQs.length ? C.cobalt : "rgba(36,27,77,0.4)", fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: savedQs.length ? "pointer" : "default" }}>
                ابدأ مراجعة المحفوظات
              </button>
            </div>

            <div style={{ background: C.card, borderRadius: 20, padding: 16, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.09)" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, fontWeight: 700, fontSize: 15 }}><Heart size={15} filled={savedCards.length > 0} color={C.cobalt} /> بطاقاتي من الفيد ({toAr(savedCards.length)})</div>
              <div style={{ fontSize: 12.5, opacity: 0.65, marginTop: 3 }}>القوانين والفخاخ التي حفظتها من الفيد</div>
              <button onClick={() => savedCards.length && setScreen("savedFeed")} disabled={!savedCards.length} style={{ width: "100%", marginTop: 10, padding: 13, borderRadius: 16, border: `2px solid ${C.cobalt}`, background: savedCards.length ? "transparent" : C.bgSoft, color: savedCards.length ? C.cobalt : "rgba(36,27,77,0.4)", fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: savedCards.length ? "pointer" : "default" }}>
                استعرض البطاقات
              </button>
            </div>

            <a href={TG_LINK} target="_blank" rel="noreferrer" style={{ display: "block", textDecoration: "none", background: C.cobalt, borderRadius: 20, padding: 16, marginTop: 12, boxShadow: "0 8px 24px rgba(27,58,200,0.2)" }}>
              <div style={{ fontWeight: 700, fontSize: 15, color: "#fff", display: "flex", alignItems: "center", gap: 6 }}><Sparkle size={15} /> قناة فوس بالتيلقرام</div>
              <div style={{ fontSize: 12.5, color: "rgba(255,255,255,0.85)", marginTop: 3 }}>القناة الرئيسية — تحديثات المقطع والتطبيق</div>
              <div style={{ background: C.gold, color: "#fff", fontWeight: 700, borderRadius: 14, padding: 12, marginTop: 10, textAlign: "center", fontSize: 14 }}>انضم الآن ✦</div>
            </a>
          </div>
        )}

        {/* --- أنا --- */}
        {tab === "me" && (
          <div style={{ padding: "16px 20px 20px", maxWidth: 520, width: "100%", margin: "0 auto", boxSizing: "border-box" }}>
            <div style={{ background: C.card, borderRadius: 20, padding: 18, boxShadow: "0 8px 24px rgba(27,58,200,0.09)", display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ width: 50, height: 50, borderRadius: "50%", background: C.bgSoft, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, color: C.cobalt, fontSize: 18 }}>{toAr(lvl)}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, fontSize: 17 }}>{name}</div>
                <div style={{ fontSize: 12.5, opacity: 0.6, fontWeight: 700 }}>المستوى {toAr(lvl)} · {toAr(xp)} نقطة</div>
                {profile && (profile.when || profile.expect) && <div style={{ fontSize: 11.5, opacity: 0.55, marginTop: 2 }}>{profile.when ? `اختبارك: ${prTxt(profile.when)}` : ""}{profile.when && profile.expect ? " · " : ""}{profile.expect ? `توقعك: ${prTxt(profile.expect)}` : ""}</div>}
              </div>
              <div style={{ fontSize: 11.5, fontWeight: 700, background: C.bgSoft, borderRadius: 999, padding: "6px 12px" }}>
                {plan === "season" ? "باقة فوس (٣ شهور)" : plan === "month" ? "اشتراك شهري" : "مجاني"}
              </div>
            </div>

            {isPaid ? (
              <a href={TG_COMMUNITY} target="_blank" rel="noreferrer" style={{ display: "block", textDecoration: "none", marginTop: 12 }}>
                <div style={{ background: C.card, borderRadius: 16, padding: "14px 16px", boxShadow: "0 6px 18px rgba(27,58,200,0.07)", display: "flex", alignItems: "center", gap: 10 }}>
                  <Sparkle size={18} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5, color: C.ink }}>المجتمع الخاص في تيلقرام</div>
                    <div style={{ fontSize: 12, opacity: 0.6, color: C.ink }}>مشتركو فوس — ملفات التأسيس والنقاش</div>
                  </div>
                  <span style={{ color: C.cobalt, fontWeight: 700, fontSize: 13 }}>انضم ←</span>
                </div>
              </a>
            ) : (
              <button onClick={() => setPaywall(true)} style={{ width: "100%", textAlign: "right", border: "none", padding: 0, background: "none", cursor: "pointer", marginTop: 12, fontFamily: "inherit" }}>
                <div style={{ background: C.card, borderRadius: 16, padding: "14px 16px", boxShadow: "0 6px 18px rgba(27,58,200,0.07)", display: "flex", alignItems: "center", gap: 10 }}>
                  <Sparkle size={18} color="rgba(36,27,77,0.35)" glow={false} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 14.5, color: C.ink }}>المجتمع الخاص في تيلقرام</div>
                    <div style={{ fontSize: 12, opacity: 0.6, color: C.ink }}>حصري لمشتركي باقة فوس</div>
                  </div>
                  <span style={{ color: "rgba(36,27,77,0.45)", fontWeight: 700, fontSize: 13 }}>مقفول</span>
                </div>
              </button>
            )}
            <div style={{ marginTop: 16 }}>
              <div style={{ fontWeight: 700, fontSize: 15, marginBottom: 10 }}>باقات فوس</div>

              <div style={{ background: C.card, borderRadius: 18, padding: 18, border: plan === "season" ? `2px solid ${C.cobalt}` : "2px solid transparent", boxShadow: "0 6px 18px rgba(27,58,200,0.07)", position: "relative" }}>
                <div style={{ position: "absolute", top: -10, right: 14, background: C.gold, color: "#fff", borderRadius: 999, fontSize: 10.5, fontWeight: 700, padding: "3px 12px" }}>{recMonthly ? "وفّر ٣٢٪ عن الشهري" : profile && profile.when ? "الأنسب لاختبارك — وفّر ٣٢٪" : "الأفضل — وفّر ٣٢٪ عن الشهري"}</div>
                <div style={{ display: "flex", alignItems: "center", marginTop: 4 }}>
                  <div style={{ fontWeight: 700, fontSize: 17 }}>باقة ٣ شهور ✦</div>
                  <div style={{ marginRight: "auto", fontWeight: 700, color: C.cobalt, fontSize: 16 }}>٣٩ ر.س</div>
                </div>
                <div style={{ fontSize: 13.5, lineHeight: 2, opacity: 0.85, marginTop: 8 }}>
                  أسئلة تدريب بلا حدود + الفيد التكيفي (يتشكل من أخطائك) + الشرح الذكي بضغطة لكل سؤال + التقرير الكامل وتوقع درجتك المتجدد + المجتمع الخاص
                </div>
                <div style={{ fontSize: 12, fontWeight: 700, color: C.cobalt, marginTop: 8 }}>٣ شهور = رحلة تأسيس القدرات كاملة — بدل ٥٧ بالاشتراك الشهري</div>
                {plan !== "season" && (
                  <button onClick={() => setPlan("season")} style={{ ...primaryBtn, width: "100%", marginTop: 10, padding: 12, fontSize: 14.5, borderRadius: 12 }}>اشترك</button>
                )}
              </div>

              <div style={{ background: C.card, borderRadius: 18, padding: 18, marginTop: 10, border: plan === "month" ? `2px solid ${C.cobalt}` : "2px solid transparent", boxShadow: "0 6px 18px rgba(27,58,200,0.07)", position: "relative" }}>
                {recMonthly && <div style={{ position: "absolute", top: -10, right: 14, background: C.gold, color: "#fff", borderRadius: 999, fontSize: 10.5, fontWeight: 700, padding: "3px 12px" }}>الأنسب لاختبارك</div>}
                <div style={{ display: "flex", alignItems: "center" }}>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>اشتراك شهري</div>
                  <div style={{ marginRight: "auto", fontWeight: 700, color: C.cobalt, fontSize: 15 }}>١٩ ر.س / شهر</div>
                </div>
                <div style={{ fontSize: 13, lineHeight: 1.9, opacity: 0.8, marginTop: 6 }}>كل مزايا فوس نفسها — لمن يبي يبدأ شهراً بشهر</div>
                {plan !== "month" && (
                  <button onClick={() => setPlan("month")} style={{ width: "100%", marginTop: 10, padding: 12, borderRadius: 12, border: `2px solid ${C.cobalt}`, background: "transparent", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>اشترك</button>
                )}
              </div>

              <div style={{ fontSize: 11.5, opacity: 0.55, marginTop: 8, lineHeight: 1.7 }}>الدفع الفعلي يتفعّل عند الإطلاق الرسمي عبر بوابة الدفع. لغير المشترك ١٠ أسئلة مجانية كل يوم.</div>
            </div>

            <button onClick={() => { try { localStorage.removeItem("phos-user-v6"); } catch (e) {} setXp(0); setBest(0); setSolved(0); setCorrectCount(0); setStreak(0); setSkills({}); setSavedQs([]); setSavedTitles([]); setSavedCards([]); setInterests({}); setDayStreak(0); setLastDay(""); interestsRef.current = {}; weakRef.current = {}; setFcBase(null); setProfile(null); setObStep(0); setObAns({}); setIntroSeen(false); setScreen("welcome"); }} style={{ width: "100%", marginTop: 16, padding: 12, borderRadius: 14, border: "none", background: "rgba(255,255,255,0.6)", color: C.ink, fontWeight: 700, fontFamily: "inherit", fontSize: 13.5, cursor: "pointer" }}>إعادة ضبط تقدمي</button>
          </div>
        )}
      </div>

      {/* شريط التنقل — أيقونات بسيطة */}
      <div style={{ display: "flex", background: "rgba(255,255,255,0.94)", borderTop: `1px solid ${C.bgSoft}`, zIndex: 5 }}>
        {[
          ["feed", <Sparkle key="f" size={22} color={tab === "feed" ? C.cobalt : "rgba(36,27,77,0.4)"} />, "الصفحة الرئيسية"],
          ["train", <IconTarget key="t" size={22} color={tab === "train" ? C.cobalt : "rgba(36,27,77,0.4)"} />, "تدريب"],
          ["lib", <IconTriangle key="l" size={22} color={tab === "lib" ? C.cobalt : "rgba(36,27,77,0.4)"} />, "مرجع"],
          ["me", <IconUser key="m" size={22} color={tab === "me" ? C.cobalt : "rgba(36,27,77,0.4)"} />, "الصفحة الشخصية"],
        ].map(([k, icon, label]) => (
          <button key={k} className="navBtn" aria-label={label} onClick={() => setTab(k)} style={{ color: tab === k ? C.cobalt : "rgba(36,27,77,0.45)" }}>
            {icon}
          </button>
        ))}
      </div>

      {limitHit && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(36,27,77,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 62, padding: 24 }} onClick={() => setLimitHit(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: C.card, borderRadius: 24, padding: "28px 24px", maxWidth: 360, width: "100%", textAlign: "center", animation: "popIn .35s ease both" }}>
            <Sparkle size={44} />
            <h3 style={{ fontSize: 19, fontWeight: 700, margin: "12px 0 8px" }}>خلّصت أسئلتك العشرة اليوم ✦</h3>
            <p style={{ fontSize: 14, lineHeight: 1.9, opacity: 0.8, margin: "0 0 16px" }}>شرارتك اشتعلت وتعبك محفوظ. ترجع لك ١٠ أسئلة جديدة بكرة — أو افتح أسئلة بلا حدود بالاشتراك.</p>
            <button onClick={() => { setLimitHit(false); setPaywall(true); }} style={{ ...primaryBtn, width: "100%", padding: 14, fontSize: 15.5 }}>شوف الباقات — تبدأ من ١٩ ر.س</button>
            <button onClick={() => { setLimitHit(false); setTab("lib"); }} style={{ border: "none", background: "none", color: "rgba(36,27,77,0.55)", fontFamily: "inherit", fontWeight: 700, fontSize: 13, marginTop: 10, cursor: "pointer" }}>أكمل في المرجع لحين بكرة</button>
          </div>
        </div>
      )}
      {paywall && (
        <div style={{ position: "absolute", inset: 0, background: "rgba(36,27,77,0.5)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 24 }} onClick={() => setPaywall(false)}>
          <div onClick={(e) => e.stopPropagation()} style={{ background: C.card, borderRadius: 24, padding: "28px 24px", maxWidth: 360, width: "100%", textAlign: "center", animation: "popIn .35s ease both" }}>
            <Sparkle size={40} />
            <h3 style={{ fontSize: 19, fontWeight: 700, margin: "12px 0 8px" }}>افتح فوس كاملاً</h3>
            <p style={{ fontSize: 14, lineHeight: 1.9, opacity: 0.8, margin: "0 0 16px" }}>أسئلة بلا حدود + الفيد التكيفي اللي يتشكل من أخطائك + الشرح الذكي لكل سؤال + التقرير الكامل وتوقع درجتك + المجتمع الخاص.</p>
            {profile && profile.when && <div style={{ fontSize: 12, fontWeight: 700, color: C.cobalt, marginBottom: 10 }}>اختبارك «{prTxt(profile.when)}» → الأنسب لك: {recMonthly ? "الاشتراك الشهري" : "باقة ٣ شهور"}</div>}
            {recMonthly ? (
              <>
                <button onClick={() => { setPlan("month"); setPaywall(false); }} style={{ ...primaryBtn, width: "100%", padding: 14, fontSize: 15.5 }}>شهر واحد — ١٩ ر.س · الأنسب لاختبارك</button>
                <button onClick={() => { setPlan("season"); setPaywall(false); }} style={{ width: "100%", marginTop: 8, padding: 12, borderRadius: 16, border: `2px solid ${C.cobalt}`, background: "transparent", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>٣ شهور — ٣٩ ر.س · وفّر ٣٢٪</button>
              </>
            ) : (
              <>
                <button onClick={() => { setPlan("season"); setPaywall(false); }} style={{ ...primaryBtn, width: "100%", padding: 14, fontSize: 15.5 }}>٣ شهور — ٣٩ ر.س · وفّر ٣٢٪</button>
                <button onClick={() => { setPlan("month"); setPaywall(false); }} style={{ width: "100%", marginTop: 8, padding: 12, borderRadius: 16, border: `2px solid ${C.cobalt}`, background: "transparent", color: C.cobalt, fontWeight: 700, fontFamily: "inherit", fontSize: 14, cursor: "pointer" }}>شهر واحد — ١٩ ر.س</button>
              </>
            )}
            <button onClick={() => setPaywall(false)} style={{ border: "none", background: "none", color: "rgba(36,27,77,0.55)", fontFamily: "inherit", fontWeight: 700, fontSize: 13, marginTop: 10, cursor: "pointer" }}>لاحقاً</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PhosApp />);
    </script>
  </body>
</html>
